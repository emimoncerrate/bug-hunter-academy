<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bug Hunter Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&family=Space+Mono:wght@700&display=swap">
<style>
/* Layout: a classroom tool. Left rail = the course path, right = one module or one game at a time.
   The code editor stays dark like the Dino Run editor in both themes. */
:root{
  --bg:#EFEEF4; --panel:#FFFFFF; --panel-2:#F6F5FA; --ink:#1B1830; --muted:#5B5773; --line:#DCD9E7;
  --accent:#17805F; --accent-bg:#7FE0C0; --accent-ink:#0F3D2F; --bug:#B83A28;
  --good:#17805F; --good-bg:#E0F4EC; --bad-bg:#FBE8E4; --note-bg:#FFF4DF; --focus:#3A6FF2;
  --ed:#1E1A30; --ed-2:#2A2542; --ed-line:#454063; --ed-ink:#EDEBFF; --ed-muted:#B6B0D6;
  --ev:#F2CF9E; --ct:#EEB0A0; --mo:#9CCBF0; --lo:#C9B4F0; --se:#A7DEC4; --op:#A9DFA0; --va:#F6C58C; --blk-ink:#1B1830;
  --f-display:'Space Mono', 'Courier New', monospace;
  --f-body:'Atkinson Hyperlegible', Verdana, Arial, sans-serif;
  --f-code:'JetBrains Mono', Consolas, 'Courier New', monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#13111C; --panel:#1C1929; --panel-2:#231F35; --ink:#ECEAF6; --muted:#A9A4C2; --line:#35304B;
  --accent:#5FD3A9; --accent-bg:#6FD8B6; --accent-ink:#0B2F24; --bug:#FF8A76;
  --good:#5FD3A9; --good-bg:#16342A; --bad-bg:#3A1F1B; --note-bg:#342A17; --focus:#8FB0FF;
  --ed:#16132A; --ed-2:#221E38; color-scheme: dark; } }
:root[data-theme="dark"]{
  --bg:#13111C; --panel:#1C1929; --panel-2:#231F35; --ink:#ECEAF6; --muted:#A9A4C2; --line:#35304B;
  --accent:#5FD3A9; --accent-bg:#6FD8B6; --accent-ink:#0B2F24; --bug:#FF8A76;
  --good:#5FD3A9; --good-bg:#16342A; --bad-bg:#3A1F1B; --note-bg:#342A17; --focus:#8FB0FF;
  --ed:#16132A; --ed-2:#221E38; color-scheme: dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.5; margin:0}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
h1,h2,h3{font-family:var(--f-display); line-height:1.15; text-wrap:balance; margin:0}
p{margin:0}
code,.code{font-family:var(--f-code); font-size:.92em; background:var(--panel-2); border:1px solid var(--line); padding:0 .35em; border-radius:6px; white-space:nowrap}

/* ---------- shell */
.top{display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:env(safe-area-inset-top,0px); z-index:5}
.brand{display:flex; align-items:center; gap:10px; margin-right:auto}
.brand svg{flex:none}
.brand b{font-family:var(--f-display); font-size:18px; letter-spacing:.02em}
.meter{display:flex; align-items:center; gap:10px; font-size:14px; color:var(--muted)}
.meter .bar{width:140px; height:10px; border-radius:99px; background:var(--panel-2); border:1px solid var(--line); overflow:hidden}
.meter .bar i{display:block; height:100%; background:var(--accent-bg); width:0}
.btn{border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:7px 14px; cursor:pointer; font-weight:700; font-size:15px}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent-bg); color:var(--accent-ink); border-color:transparent}
.btn.primary:hover{filter:brightness(.96)}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden}
.seg button{border:0; background:var(--panel); padding:6px 12px; cursor:pointer; font-weight:700; font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--panel)}

.wrap{display:grid; grid-template-columns:260px minmax(0,1fr); min-height:calc(100% - 62px)}
.rail{border-right:1px solid var(--line); background:var(--panel); padding:18px 12px; display:flex; flex-direction:column; gap:4px}
.rail h4{font-family:var(--f-body); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:14px 10px 4px}
.nav{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px; text-decoration:none; color:var(--ink); border:0; background:none; width:100%; text-align:left; cursor:pointer; font-size:16px}
.nav:hover{background:var(--panel-2)}
.nav[aria-current="page"]{background:var(--panel-2); box-shadow:inset 3px 0 0 var(--accent)}
.nav .st{width:24px; height:24px; flex:none; border-radius:50%; display:grid; place-items:center; font-size:13px; font-weight:700; border:2px solid var(--line); color:var(--muted)}
.nav .st.done{background:var(--accent-bg); border-color:transparent; color:var(--accent-ink)}
.nav.locked{color:var(--muted); cursor:not-allowed}
.nav small{display:block; color:var(--muted); font-size:13px; line-height:1.2}
.teacher{margin-top:auto; padding:14px 10px 0; font-size:14px; color:var(--muted)}
.teacher summary{cursor:pointer}
.teacher .row{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}

main{padding:28px clamp(16px,3vw,40px) 60px; min-width:0}
.page{max-width:1180px; margin:0 auto; display:flex; flex-direction:column; gap:26px}
.eyebrow{font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:700}
.page-h{display:flex; flex-direction:column; gap:8px}
.page-h h1{font-size:clamp(28px,4vw,40px)}
.lead{font-size:19px; max-width:65ch; color:var(--muted)}

.sec{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px; display:flex; flex-direction:column; gap:16px; min-width:0}
.sec-h{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.sec-h h2{font-size:22px}
.tag{font-size:12px; letter-spacing:.1em; text-transform:uppercase; font-weight:700; padding:3px 9px; border-radius:99px; background:var(--panel-2); border:1px solid var(--line); color:var(--muted)}
.tag.ok{background:var(--good-bg); color:var(--good); border-color:transparent}
.say{max-width:70ch}
.points{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.point{background:var(--panel-2); border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:6px}
.point b{font-size:17px}
.two{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px; align-items:start}
.frame{background:var(--note-bg); border-radius:12px; padding:12px 16px; font-size:17px}
.frame b{font-family:var(--f-code); font-weight:700}
table.t{border-collapse:collapse; width:100%; font-size:16px}
table.t th,table.t td{border-bottom:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top}
table.t th{font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.tablewrap{overflow-x:auto}
.vocab{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px}
.vocab div{background:var(--panel-2); border-radius:12px; padding:10px 14px}
.vocab b{font-family:var(--f-display); font-size:17px; display:block}
.vocab i{color:var(--muted); font-size:14px}
svg.fig{width:100%; height:auto; display:block; max-width:760px}
.shot{border-radius:14px; overflow:hidden; border:1px solid var(--line); max-width:900px; background:#F7F7F7}
.shot svg.fig{max-width:none}

/* ---------- checks */
.q{display:flex; flex-direction:column; gap:10px; padding:14px 0; border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q .opts{display:flex; flex-wrap:wrap; gap:8px}
.opt{border:2px solid var(--line); background:var(--panel); border-radius:12px; padding:8px 14px; cursor:pointer; font-size:16px; text-align:left}
.opt:hover{border-color:var(--muted)}
.opt.right{border-color:var(--good); background:var(--good-bg)}
.opt.wrong{border-color:var(--bug); background:var(--bad-bg)}
.fb{font-size:16px; padding:8px 12px; border-radius:10px}
.fb.good{background:var(--good-bg); color:var(--good)}
.fb.bad{background:var(--bad-bg)}
.pass{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:14px 16px; border-radius:12px; background:var(--good-bg)}
.pass b{color:var(--good)}

/* ---------- editor */
.ed{background:var(--ed); color:var(--ed-ink); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:10px; min-width:0}
.ed-tabs{display:flex; flex-wrap:wrap; gap:6px}
.ed-tab{background:var(--ed-2); color:var(--ed-ink); border:1px solid var(--ed-line); border-radius:99px; padding:4px 12px; cursor:pointer; font-family:var(--f-code); font-size:14px; font-weight:700}
.ed-tab.on{background:var(--ed-ink); color:var(--ed)}
.ed-bar{display:flex; flex-wrap:wrap; gap:6px; align-items:center; border-bottom:1px solid var(--ed-line); padding-bottom:10px}
.tb{background:var(--ed-2); color:var(--ed-ink); border:1px solid var(--ed-line); border-radius:8px; min-width:40px; padding:4px 10px; cursor:pointer; font-weight:700; font-size:15px}
.tb:hover:not([disabled]){background:var(--ed-line)}
.tb[disabled]{opacity:.35; cursor:not-allowed}
.tb-hint{font-size:13px; color:var(--ed-muted); margin-left:4px}
.ed-lines{display:flex; flex-direction:column; overflow-x:auto; padding:2px; position:relative}
.blk.grab{cursor:grab; touch-action:none; user-select:none}
.blk.grab:hover{filter:brightness(1.05)}
.ln.dragging{opacity:.3}
.drag-ghost{position:fixed; z-index:50; pointer-events:none; opacity:.92; filter:drop-shadow(0 8px 14px rgba(0,0,0,.35)); left:0; top:0}
.drop-mark{position:absolute; right:6px; height:5px; background:#FFE066; border-radius:3px; pointer-events:none; box-shadow:0 0 0 2px var(--ed)}
body.is-dragging, body.is-dragging *{cursor:grabbing!important; user-select:none}
.trash{margin-left:auto; border:2px dashed var(--ed-line); border-radius:9px; padding:5px 14px; font-size:13px; font-weight:700; color:var(--ed-muted)}
.trash.hot{border-color:#FF8A76; background:rgba(255,138,118,.18); color:var(--ed-ink)}
.ed-empty{color:var(--ed-muted); font-size:14px; padding:8px}
.ln{display:flex; align-items:stretch; cursor:pointer; border-radius:10px; min-width:max-content}
.ln-gap{margin-top:16px}
.guide{width:24px; flex:none; margin-left:10px; border-left:3px solid var(--ed-line)}
.blk{color:var(--blk-ink); border-radius:10px; padding:5px 12px; margin:2px 0; font-family:var(--f-code); font-weight:700; font-size:14.5px; display:flex; align-items:center; min-height:38px}
.blk.hat{border-radius:16px 16px 10px 10px}
.blk-ev{background:var(--ev)} .blk-ct{background:var(--ct)} .blk-mo{background:var(--mo)} .blk-lo{background:var(--lo)} .blk-va{background:var(--va)}
.blk-text{display:flex; flex-wrap:nowrap; gap:6px; align-items:center; white-space:nowrap}
.slot{background:#FFFFFF; color:#1B1830; border:1px solid rgba(27,24,48,.25); border-radius:7px; padding:1px 4px; font:inherit; font-size:14px; min-width:4ch; text-align:center; box-sizing:content-box}
select.slot{text-align:left; padding-right:4px; cursor:pointer}
input.slot:focus,select.slot:focus{outline:3px solid #FFE066; outline-offset:0}
.slot-t{text-align:left}
.rep{display:inline-flex; gap:5px; align-items:center; border-radius:99px; padding:2px 8px; color:#1B1830}
.rep-mo{background:#C3E2F8; border:1px solid rgba(27,24,48,.2)} .rep-se{background:var(--se)} .rep-op{background:var(--op)} .rep-va{background:var(--va); border:2px solid rgba(27,24,48,.45)} .rep-empty{background:rgba(255,255,255,.6)}
.ln.sel .blk{outline:3px solid #FFE066; outline-offset:1px}
.blk.warn{outline:2px dashed #FF8A76; outline-offset:1px}
.blk.detached{opacity:.5}
.ln.hit .blk{outline:3px solid #6FD8B6; outline-offset:1px}
.ln.miss .blk{outline:3px solid #FF8A76; outline-offset:1px}
.ed-bin{border-top:1px solid var(--ed-line); padding-top:10px; display:flex; flex-direction:column; gap:6px}
.ed-bin-h{font-size:13px; color:var(--ed-muted)}
.bin-b{cursor:grab; touch-action:none; user-select:none; align-self:flex-start}

/* ---------- playground */
.pg{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:18px; align-items:start}
.stagecol{display:flex; flex-direction:column; gap:12px; min-width:0}
.stage{position:relative; border-radius:14px; overflow:hidden; border:1px solid var(--line); background:#F7F6F2}
.stage canvas{display:block; width:100%; height:auto}
.stage .ov{position:absolute; inset:0; display:grid; place-items:center; pointer-events:none}
.stage .ov span{background:rgba(27,24,48,.82); color:#FFFFFF; font-weight:700; padding:8px 16px; border-radius:10px; font-size:16px; text-align:center; max-width:85%}
.controls{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.runb{background:var(--accent-bg); color:var(--accent-ink); border:0; border-radius:10px; padding:8px 18px; font-weight:700; cursor:pointer; font-size:16px}
.stopb{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 16px; font-weight:700; cursor:pointer}
.changed{font-size:14px; font-weight:700; color:var(--bug)}
.pad{display:flex; gap:6px; margin-left:auto}
.pad button{width:42px; height:38px; border-radius:9px; border:1px solid var(--line); background:var(--panel); font-weight:700; cursor:pointer; touch-action:none; user-select:none}
.pad button.wide{width:auto; padding:0 12px}
.ctrl-note{font-size:14px; color:var(--muted)}
.watch{background:var(--panel-2); border-radius:12px; padding:10px 12px}
.watch h3{font-family:var(--f-body); font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:4px}
.watch table{border-collapse:collapse; width:100%; font-family:var(--f-code); font-size:13.5px; font-variant-numeric:tabular-nums}
.watch td,.watch th{padding:3px 8px 3px 0; text-align:left}
.watch th{color:var(--muted); font-weight:500}
.goal{border-radius:12px; padding:12px 14px; background:var(--note-bg); display:flex; flex-direction:column; gap:6px}
.goal.done{background:var(--good-bg)}
.goal b{font-size:14px; letter-spacing:.08em; text-transform:uppercase}

/* ---------- arcade */
.cabinets{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px}
.cab{border:1px solid var(--line); background:var(--panel); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:8px; text-align:left; cursor:pointer}
.cab:hover:not([disabled]){border-color:var(--muted)}
.cab[disabled]{opacity:.5; cursor:not-allowed}
.cab .no{font-family:var(--f-display); font-size:30px; line-height:1}
.cab h3{font-size:19px}
.cab .meta{display:flex; justify-content:space-between; font-size:14px; color:var(--muted)}
.stars{color:#D99A00; letter-spacing:2px; font-size:15px}
.reports{display:flex; flex-direction:column; gap:10px}
.rep-card{border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; background:var(--panel)}
.rep-card.done{background:var(--good-bg); border-color:transparent}
.rep-top{display:flex; gap:10px; align-items:flex-start}
.rep-top .n{font-family:var(--f-display); font-size:15px; background:var(--panel-2); border-radius:8px; padding:2px 8px}
.chip{font-size:13px; font-weight:700; padding:2px 9px; border-radius:99px; white-space:nowrap}
.chip.todo{background:var(--panel-2); color:var(--muted)}
.chip.fix{background:var(--note-bg)}
.chip.ok{background:var(--accent-bg); color:var(--accent-ink)}
.hintlist{margin:0; padding-left:20px; font-size:15px}
.kinds{display:flex; flex-wrap:wrap; gap:6px}
.kinds .opt{font-size:15px; padding:6px 12px}
.small{font-size:14px; color:var(--muted)}
.field{display:flex; flex-direction:column; gap:6px}
.field input,.field textarea{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 10px; width:100%}
.field textarea{min-height:80px; resize:vertical}
.badge{display:grid; grid-template-columns:auto 1fr; gap:18px; align-items:center; background:var(--ed); color:var(--ed-ink); border-radius:16px; padding:20px}
.badge .big{font-family:var(--f-display); font-size:28px}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}


/* ---------- one step at a time */
.page-steps{gap:16px}
.h1-sm{font-size:clamp(24px,3vw,32px)}
.stepper{display:flex; gap:5px; flex-wrap:wrap}
.seg-dot{flex:1 1 18px; min-width:18px; max-width:64px; height:12px; border-radius:99px; border:0; background:var(--line); cursor:pointer; padding:0}
.seg-dot.ok{background:var(--accent-bg)}
.seg-dot.cur{background:var(--ink)}
.seg-dot[disabled]{cursor:not-allowed; opacity:.55}
.step-label{font-size:15px; font-weight:700; color:var(--muted)}
.step-stage{display:flex; flex-direction:column; gap:14px; min-height:320px}
.step-lead{font-size:18px}
.step-card{padding:34px clamp(20px,4vw,48px); gap:18px; align-items:flex-start}
.step-card.win{align-items:center; text-align:center}
.big-h{font-size:clamp(24px,3.2vw,34px)}
.big-p{font-size:clamp(19px,2vw,23px); line-height:1.5; max-width:40ch}
.step-card .frame{font-size:19px}
.big-opts{flex-direction:column; align-items:stretch; max-width:560px}
.big-opts .opt{font-size:18px; padding:12px 18px}
.big-btn{font-size:17px; padding:11px 22px; text-decoration:none; display:inline-block}
.stepnav{display:flex; align-items:center; gap:14px; position:sticky; bottom:0; padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px)); background:var(--bg); border-top:1px solid var(--line)}
.stepnav .small{flex:1; text-align:center}
.spot-ed{max-width:640px}

@media (max-width:980px){
  .pg,.two{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .rail{border-right:0; border-bottom:1px solid var(--line); flex-direction:row; overflow-x:auto; padding:8px 12px}
  .rail h4,.teacher,.nav small{display:none}
  .nav{width:auto; white-space:nowrap}
  .meter .bar{width:80px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important; animation:none!important} }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="3" y="3" width="24" height="24" rx="7" fill="#7FE0C0"/><circle cx="15" cy="16" r="6" fill="#1B1830"/><path d="M9 9l3 3M21 9l-3 3M7 16h2M21 16h2M9 23l3-2M21 23l-3-2" stroke="#1B1830" stroke-width="2" stroke-linecap="round"/></svg>
    <b>Bug Hunter Academy</b>
  </div>
  <div class="meter"><span id="meterTxt">0%</span><span class="bar"><i id="meterBar"></i></span></div>
  <div class="seg" role="group" aria-label="Language">
    <button type="button" id="langEn" aria-pressed="true">EN</button>
    <button type="button" id="langEs" aria-pressed="false">ES</button>
  </div>
  <button type="button" class="btn" id="readBtn">Read aloud</button>
</header>
<div class="wrap">
  <nav class="rail" id="rail" aria-label="Lesson path"></nav>
  <main id="main"></main>
</div>

<script src="engine.js"></script>
<script src="games.js"></script>
<script src="app.js"></script>
</body>
</html>
